name: Auto Organize & Sync Mock Tests

on:
  push:
    branches:
      - main
    paths:
      - 'pending_mocks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Sync and Organize Script
        run: node sync_and_generate.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "BytePrep Sync Bot"
          git config --global user.email "bot@dsssbpyq.online"
          
          # Check if there are any changes
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, committing and pushing..."
            git add .
            git commit -m "Auto-sync: Organize newly added mock test JSON files and update metadata"
            git push origin main
          else
            echo "No changes detected. Metadata is already up to date."
          fi
