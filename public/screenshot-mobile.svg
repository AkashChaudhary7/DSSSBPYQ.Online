<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- CSS Styles for animations and fonts -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap');
    text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#0f172a" />
  
  <!-- Outer subtle gradient glow -->
  <circle cx="195" cy="150" r="180" fill="#2563eb" opacity="0.15" filter="blur(40px)" />
  <circle cx="195" cy="700" r="150" fill="#4f46e5" opacity="0.1" filter="blur(40px)" />

  <!-- Status Bar Mock -->
  <rect width="100%" height="40" fill="#090d16" opacity="0.4" />
  <text x="32" y="25" fill="#94a3b8" font-size="12" font-weight="600">09:41</text>
  <!-- WiFi, Battery, Signal Icons -->
  <g transform="translate(320, 15)" stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M0,10 L0,8 A2,2 0 0,1 2,6 L4,6 A2,2 0 0,1 6,8 L6,10 Z" />
    <rect x="10" y="2" width="18" height="10" rx="2" />
    <rect x="12" y="4" width="10" height="6" fill="#94a3b8" />
  </g>

  <!-- Navigation Header Mock -->
  <g transform="translate(0, 40)">
    <rect width="100%" height="64" fill="#0f172a" stroke-b="#1e293b" stroke-width="1" />
    <!-- Mini Logo -->
    <rect x="20" y="12" width="40" height="40" rx="12" fill="#1e293b" />
    <path d="M30,32 L30,35 C30,37 32,38 35,38 C38,38 40,37 40,35 L40,32" fill="none" stroke="#3b82f6" stroke-width="3" />
    <polygon points="35,22 45,27 35,32 25,27" fill="#3b82f6" />
    <circle cx="25" cy="27" r="2" fill="#fbbf24" />

    <text x="72" y="32" fill="#ffffff" font-size="16" font-weight="800">DSSSBpyq<tspan fill="#fbbf24">.Online</tspan></text>
    <text x="72" y="45" fill="#64748b" font-size="10" font-weight="600">2026 TGT CS (Post 41/26)</text>

    <!-- Notification Dot -->
    <circle cx="350" cy="32" r="16" fill="#1e293b" />
    <circle cx="354" cy="24" r="5" fill="#ef4444" />
  </g>

  <!-- Hero Promotional Banner -->
  <g transform="translate(20, 124)">
    <rect width="350" height="160" rx="24" fill="gradient" style="fill:url(#hero-gradient)" />
    <defs>
      <linearGradient id="hero-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e40af" />
        <stop offset="100%" stop-color="#312e81" />
      </linearGradient>
    </defs>
    
    <rect width="350" height="160" rx="24" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5" />
    
    <text x="24" y="44" fill="#fbbf24" font-size="11" font-weight="800" letter-spacing="1">PREMIUM PWA PRACTICE</text>
    <text x="24" y="74" fill="#ffffff" font-size="20" font-weight="800">TGT Computer Science</text>
    <text x="24" y="98" fill="#ffffff" font-size="20" font-weight="800">Complete Mock Series</text>
    
    <!-- Badges in banner -->
    <rect x="24" y="118" width="130" height="24" rx="8" fill="#2563eb" />
    <text x="34" y="134" fill="#ffffff" font-size="10" font-weight="700">650+ Active Mock Tests</text>

    <rect x="162" y="118" width="90" height="24" rx="8" fill="#1e293b" />
    <text x="172" y="134" fill="#fbbf24" font-size="10" font-weight="700">100% Free Access</text>
  </g>

  <!-- Stats Grid -->
  <g transform="translate(0, 304)">
    <!-- Active Learners Card -->
    <g transform="translate(20, 0)">
      <rect width="165" height="80" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="28" fill="#94a3b8" font-size="11" font-weight="600">ACTIVE LEARNERS</text>
      <text x="16" y="56" fill="#ffffff" font-size="22" font-weight="800">4,812+</text>
      <circle cx="140" cy="40" r="14" fill="#1e1b4b" />
      <!-- users icon -->
      <path d="M135,43 C135,41 140,40 140,40 C140,40 145,41 145,43 M140,37 C142,37 142,35 140,35 C138,35 138,37 140,37" stroke="#3b82f6" stroke-width="1.5" fill="none" />
    </g>

    <!-- Mocks Attempted -->
    <g transform="translate(205, 0)">
      <rect width="165" height="80" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="28" fill="#94a3b8" font-size="11" font-weight="600">TESTS COMPLETED</text>
      <text x="16" y="56" fill="#fbbf24" font-size="22" font-weight="800">142.5K+</text>
      <circle cx="140" cy="40" r="14" fill="#2d1b10" />
      <!-- trophy icon -->
      <path d="M136,36 L144,36 M140,36 L140,42 M137,42 L143,42" stroke="#fbbf24" stroke-width="1.5" />
    </g>
  </g>

  <!-- Main Modules List -->
  <text x="24" y="420" fill="#ffffff" font-size="16" font-weight="800">Exam Categories &amp; Mocks</text>
  
  <g transform="translate(20, 440)">
    <!-- Row 1: Part B Computer Science -->
    <g transform="translate(0, 0)">
      <rect width="350" height="74" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <rect x="12" y="12" width="50" height="50" rx="12" fill="#1d4ed8" opacity="0.3" />
      <!-- computer icon -->
      <rect x="25" y="24" width="24" height="18" rx="2" fill="none" stroke="#3b82f6" stroke-width="2" />
      <line x1="31" y1="42" x2="43" y2="42" stroke="#3b82f6" stroke-width="2" />
      
      <text x="76" y="32" fill="#ffffff" font-size="14" font-weight="700">Part B: Computer Science</text>
      <text x="76" y="48" fill="#94a3b8" font-size="11" font-weight="500">120 Chapters • Operating Systems, DBMS...</text>
      <rect x="76" y="54" width="60" height="14" rx="4" fill="#2563eb" />
      <text x="81" y="64" fill="#ffffff" font-size="8" font-weight="700">420 Mocks</text>
    </g>

    <!-- Row 2: Part A General Booster -->
    <g transform="translate(0, 90)">
      <rect width="350" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="12" y="12" width="50" height="50" rx="12" fill="#047857" opacity="0.2" />
      <!-- book icon -->
      <path d="M25,25 L35,25 L45,25" stroke="#10b981" stroke-width="2" />
      <path d="M25,32 L45,32 M25,39 L45,39" stroke="#10b981" stroke-width="1.5" />

      <text x="76" y="32" fill="#ffffff" font-size="14" font-weight="700">Part A: General Core Booster</text>
      <text x="76" y="48" fill="#94a3b8" font-size="11" font-weight="500">Mathematics, Reasoning, English, GK</text>
      <rect x="76" y="54" width="60" height="14" rx="4" fill="#10b981" />
      <text x="81" y="64" fill="#ffffff" font-size="8" font-weight="700">230 Mocks</text>
    </g>

    <!-- Row 3: Mistake Vault -->
    <g transform="translate(0, 180)">
      <rect width="350" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="12" y="12" width="50" height="50" rx="12" fill="#b91c1c" opacity="0.2" />
      <!-- alert circle -->
      <circle cx="37" cy="37" r="12" fill="none" stroke="#ef4444" stroke-width="2" />
      <line x1="37" y1="31" x2="37" y2="38" stroke="#ef4444" stroke-width="2.5" />
      <circle cx="37" cy="43" r="1.5" fill="#ef4444" />

      <text x="76" y="32" fill="#ffffff" font-size="14" font-weight="700">Personal Mistake Vault</text>
      <text x="76" y="48" fill="#94a3b8" font-size="11" font-weight="500">Automated bookmark of failed questions</text>
      <rect x="76" y="54" width="85" height="14" rx="4" fill="#ef4444" />
      <text x="81" y="64" fill="#ffffff" font-size="8" font-weight="700">Adaptive Revision</text>
    </g>
  </g>

  <!-- Navigation Bar Mock Bottom -->
  <g transform="translate(0, 770)">
    <rect width="100%" height="74" fill="#090d16" stroke-t="#1e293b" stroke-width="1" />
    
    <!-- Home Tab Active -->
    <g transform="translate(48, 12)">
      <circle cx="16" cy="16" r="6" fill="#3b82f6" />
      <text x="16" y="42" fill="#3b82f6" font-size="10" font-weight="700" text-anchor="middle">Dashboard</text>
    </g>

    <!-- Analytics Tab -->
    <g transform="translate(148, 12)">
      <!-- bar chart -->
      <rect x="6" y="12" width="4" height="12" fill="#64748b" rx="1" />
      <rect x="14" y="6" width="4" height="18" fill="#64748b" rx="1" />
      <rect x="22" y="15" width="4" height="9" fill="#64748b" rx="1" />
      <text x="16" y="42" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Analytics</text>
    </g>

    <!-- Syllabus Tracker Tab -->
    <g transform="translate(248, 12)">
      <!-- checklist -->
      <rect x="8" y="8" width="16" height="16" rx="3" fill="none" stroke="#64748b" stroke-width="2" />
      <line x1="12" y1="13" x2="15" y2="13" stroke="#64748b" stroke-width="2" />
      <line x1="12" y1="19" x2="20" y2="19" stroke="#64748b" stroke-width="2" />
      <text x="16" y="42" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Syllabus</text>
    </g>

    <!-- Clear Cache Tab -->
    <g transform="translate(330, 12)">
      <!-- circular arrow / refresh -->
      <path d="M11,16 A5,5 0 1,1 16,21" fill="none" stroke="#eab308" stroke-width="2" />
      <polygon points="11,13 14,16 8,16" fill="#eab308" />
      <text x="16" y="42" fill="#eab308" font-size="10" font-weight="700" text-anchor="middle">Purge Cache</text>
    </g>
  </g>
</svg>
