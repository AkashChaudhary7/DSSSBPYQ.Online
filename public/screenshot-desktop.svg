<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap');
    text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
  </style>

  <!-- Background canvas -->
  <rect width="100%" height="100%" fill="#0f172a" />
  
  <!-- Subtle glowing lights in corners -->
  <circle cx="100" cy="100" r="300" fill="#2563eb" opacity="0.1" filter="blur(60px)" />
  <circle cx="1180" cy="620" r="250" fill="#4f46e5" opacity="0.08" filter="blur(60px)" />
  <circle cx="640" cy="360" r="200" fill="#fbbf24" opacity="0.04" filter="blur(60px)" />

  <!-- Side Navigation Bar -->
  <g id="sidebar">
    <rect width="260" height="720" fill="#090d16" stroke-r="#1e293b" stroke-width="1" />
    
    <!-- Logo & Title -->
    <g transform="translate(24, 32)">
      <rect width="42" height="42" rx="14" fill="#2563eb" />
      <!-- Graduation Cap Icon in sidebar -->
      <polygon points="21,18 33,24 21,30 9,24" fill="#ffffff" />
      <path d="M15,26 L15,31 C15,33 17,34 21,34 C25,34 27,33 27,31 L27,26" fill="none" stroke="#ffffff" stroke-width="2" />
      
      <text x="56" y="22" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.5">DSSSBpyq<tspan fill="#fbbf24">.Online</tspan></text>
      <text x="56" y="36" fill="#64748b" font-size="11" font-weight="600">Premium PWA Portal</text>
    </g>

    <!-- Navigation Items -->
    <g transform="translate(16, 120)">
      <!-- Item 1 (Active) -->
      <g transform="translate(0, 0)">
        <rect width="228" height="44" rx="12" fill="#1e293b" />
        <rect x="0" y="8" width="4" height="28" fill="#3b82f6" rx="2" />
        <!-- icon (dashboard) -->
        <circle cx="28" cy="22" r="6" fill="#3b82f6" />
        <text x="50" y="27" fill="#ffffff" font-size="13" font-weight="700">Exam Dashboard</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 56)">
        <text x="50" y="27" fill="#94a3b8" font-size="13" font-weight="600">Part A Mock Tests</text>
        <circle cx="28" cy="22" r="4" fill="#64748b" />
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 112)">
        <text x="50" y="27" fill="#94a3b8" font-size="13" font-weight="600">Part B (Computer Science)</text>
        <circle cx="28" cy="22" r="4" fill="#64748b" />
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 168)">
        <text x="50" y="27" fill="#ef4444" font-size="13" font-weight="700">Personal Mistake Vault</text>
        <!-- caution sign -->
        <circle cx="28" cy="22" r="6" fill="none" stroke="#ef4444" stroke-width="2" />
      </g>

      <!-- Item 5 -->
      <g transform="translate(0, 224)">
        <text x="50" y="27" fill="#94a3b8" font-size="13" font-weight="600">Syllabus Progress Tracker</text>
        <circle cx="28" cy="22" r="4" fill="#64748b" />
      </g>
    </g>

    <!-- Bottom Account/PWA Info -->
    <g transform="translate(20, 620)">
      <rect width="220" height="76" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1" />
      <!-- active badge -->
      <circle cx="36" cy="38" r="16" fill="#10b981" fill-opacity="0.1" />
      <circle cx="36" cy="38" r="6" fill="#10b981" />
      <text x="64" y="36" fill="#ffffff" font-size="12" font-weight="700">Offline Study Mode</text>
      <text x="64" y="52" fill="#10b981" font-size="11" font-weight="600">Fully Cached &amp; Active</text>
    </g>
  </g>

  <!-- Top bar header -->
  <g id="topbar" transform="translate(260, 0)">
    <rect width="1020" height="74" fill="#0f172a" stroke-b="#1e293b" stroke-width="1" />
    
    <!-- Title tag -->
    <text x="40" y="44" fill="#ffffff" font-size="20" font-weight="800">2026 DSSSB TGT CS Mock Exam Preparation Center</text>
    
    <!-- User panel -->
    <g transform="translate(800, 18)">
      <rect width="180" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="19" r="12" fill="#2563eb" />
      <text x="24" y="23" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">A</text>
      <text x="48" y="23" fill="#ffffff" font-size="12" font-weight="700">Aspirant_2026</text>
    </g>
  </g>

  <!-- Main Body Grid Layout -->
  <g id="body" transform="translate(260, 74)">
    
    <!-- Hero promo banner (top left of dashboard) -->
    <g transform="translate(40, 32)">
      <rect width="940" height="150" rx="24" fill="gradient" style="fill:url(#hero-desktop-gradient)" />
      <defs>
        <linearGradient id="hero-desktop-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e40af" />
          <stop offset="50%" stop-color="#312e81" />
          <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>
      </defs>
      <rect width="940" height="150" rx="24" fill="none" stroke="#2563eb" stroke-width="2" stroke-opacity="0.6" />

      <text x="40" y="46" fill="#fcd34d" font-size="12" font-weight="800" letter-spacing="1.5">OFFICIAL DSSSB PREVIOUS YEAR EXAMS (PYQs) &amp; EXPERT MOCKS</text>
      <text x="40" y="84" fill="#ffffff" font-size="26" font-weight="800">DSSSB TGT Computer Science Mock Series 2026</text>
      <text x="40" y="114" fill="#e2e8f0" font-size="14" font-weight="500">Practice exact 200-mark full tests, with 0.25 negative marking, real analytics, and instant answer keys.</text>
      
      <!-- Stats pill right side -->
      <g transform="translate(720, 30)">
        <rect width="180" height="90" rx="16" fill="#090d16" fill-opacity="0.6" stroke="#2563eb" stroke-width="1.5" />
        <text x="90" y="32" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">TOTAL LIVE MOCKS</text>
        <text x="90" y="68" fill="#ffffff" font-size="32" font-weight="800" text-anchor="middle">650+</text>
      </g>
    </g>

    <!-- Column 1: Test Selector (Left) -->
    <g transform="translate(40, 214)">
      <text x="0" y="24" fill="#ffffff" font-size="16" font-weight="800">Available Practice Mock Exams</text>
      
      <!-- Tabs filter -->
      <g transform="translate(0, 40)">
        <rect width="450" height="38" rx="10" fill="#1e293b" />
        
        <rect x="4" y="4" width="130" height="30" rx="8" fill="#2563eb" />
        <text x="69" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Computer Science</text>
        
        <text x="210" y="23" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Full 200M Mock</text>
        <text x="350" y="23" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Part A Booster</text>
      </g>

      <!-- Mock Cards Grid -->
      <g transform="translate(0, 96)">
        <!-- Card 1 -->
        <g transform="translate(0, 0)">
          <rect width="580" height="88" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
          <rect x="16" y="14" width="60" height="60" rx="12" fill="#1d4ed8" opacity="0.3" />
          <text x="46" y="49" fill="#3b82f6" font-size="18" font-weight="800" text-anchor="middle">B1</text>
          
          <text x="92" y="34" fill="#ffffff" font-size="14" font-weight="700">TGT CS Full Mock Test - OS &amp; Architecture</text>
          <text x="92" y="54" fill="#94a3b8" font-size="11" font-weight="500">100 Questions • 60 Minutes • Core CSE</text>
          
          <rect x="92" y="62" width="100" height="16" rx="4" fill="#2563eb" fill-opacity="0.15" />
          <text x="142" y="73" fill="#3b82f6" font-size="9" font-weight="700" text-anchor="middle">Syllabus Verified</text>

          <!-- start button -->
          <rect x="460" y="26" width="100" height="36" rx="10" fill="#2563eb" />
          <text x="510" y="48" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Start Exam</text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(0, 104)">
          <rect width="580" height="88" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <rect x="16" y="14" width="60" height="60" rx="12" fill="#047857" opacity="0.2" />
          <text x="46" y="49" fill="#10b981" font-size="18" font-weight="800" text-anchor="middle">B2</text>
          
          <text x="92" y="34" fill="#ffffff" font-size="14" font-weight="700">TGT CS Full Mock Test - DBMS &amp; SQL Queries</text>
          <text x="92" y="54" fill="#94a3b8" font-size="11" font-weight="500">100 Questions • 60 Minutes • High Yield</text>
          
          <rect x="92" y="62" width="100" height="16" rx="4" fill="#10b981" fill-opacity="0.15" />
          <text x="142" y="73" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">Syllabus Verified</text>

          <!-- start button -->
          <rect x="460" y="26" width="100" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="510" y="48" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">Start Exam</text>
        </g>
      </g>
    </g>

    <!-- Column 2: Dashboard Analytics & Syllabus Tracker (Right) -->
    <g transform="translate(640, 214)">
      <!-- Syllabus Tracker Progress Panel -->
      <g transform="translate(20, 0)">
        <rect width="320" height="300" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="20" y="32" fill="#ffffff" font-size="15" font-weight="800">Syllabus Tracker Progress</text>
        
        <!-- Progress Bar -->
        <g transform="translate(20, 56)">
          <text x="0" y="16" fill="#94a3b8" font-size="12" font-weight="600">Part B (Computer Science)</text>
          <text x="240" y="16" fill="#10b981" font-size="12" font-weight="700">82% Done</text>
          <!-- track -->
          <rect y="26" width="280" height="8" rx="4" fill="#0f172a" />
          <rect y="26" width="230" height="8" rx="4" fill="#10b981" />
        </g>

        <g transform="translate(20, 116)">
          <text x="0" y="16" fill="#94a3b8" font-size="12" font-weight="600">Part A (General Aptitude)</text>
          <text x="240" y="16" fill="#3b82f6" font-size="12" font-weight="700">65% Done</text>
          <!-- track -->
          <rect y="26" width="280" height="8" rx="4" fill="#0f172a" />
          <rect y="26" width="182" height="8" rx="4" fill="#3b82f6" />
        </g>

        <!-- Syllabus Items Checklist -->
        <g transform="translate(20, 196)">
          <text x="0" y="14" fill="#ffffff" font-size="12" font-weight="700">CURRENT FOCUS CONCEPTS</text>
          
          <g transform="translate(0, 24)">
            <!-- check -->
            <circle cx="8" cy="8" r="7" fill="#10b981" />
            <text x="24" y="12" fill="#e2e8f0" font-size="11" font-weight="600">Pipelining &amp; Instruction Hazards</text>
          </g>

          <g transform="translate(0, 48)">
            <!-- check -->
            <circle cx="8" cy="8" r="7" fill="#10b981" />
            <text x="24" y="12" fill="#e2e8f0" font-size="11" font-weight="600">Transaction Isolation Levels (SQL)</text>
          </g>
        </g>
      </g>
    </g>

  </g>
</svg>
